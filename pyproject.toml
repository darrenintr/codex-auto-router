[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-auto-router"
version = "0.4.0"
description = "Route Codex tasks through ChatGPT to the cheapest sufficient model and reasoning tier."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Darren"}]
keywords = ["codex", "openai", "cli", "router", "reasoning", "developer-tools", "chatgpt", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codex-auto = "codex_auto_router.cli:main"
codex-auto-router = "codex_auto_router.cli:main"
codex-auto-mcp = "codex_auto_router.mcp_server:main"
codex-route = "codex_auto_router.codex_first:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
